<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h2>Registrar Feedback</h2>
    <button id="capture">Selecionar Elemento</button>
    <div id="selectedElement" class="selected-element"></div>
    <textarea id="feedback" placeholder="Digite seu feedback..."></textarea>
    <button id="send">Enviar</button>
    <div id="statusMessage" class="status-message"></div>
    <script src="popup.js"></script>
</body>
</html>
